<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Flashcards - Koleksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">English Flashcards</div>
    <div class="counter" id="counter">Total: 0</div>
  </div>
  
  <!-- Kategori -->
  <div class="categories-bar">
    <button class="cat active" data-cat="all" onclick="setCategory('all')">All Collections</button>
    <button class="cat" data-cat="Anggota Badan" onclick="setCategory('Anggota Badan')">Body</button>
    <button class="cat" data-cat="Warna" onclick="setCategory('Warna')">Color</button>
    <button class="cat" data-cat="Hewan" onclick="setCategory('Hewan')">Animal</button>
    <button class="cat" data-cat="Benda Sekitar" onclick="setCategory('Benda Sekitar')">Object</button>
  </div>

  <!-- Koleksi Gambar (Gallery Grid) -->
  <div class="gallery" id="gallery">
    <!-- Item akan di-inject via JavaScript -->
  </div>

  <!-- Tombol Mulai Flashcard di Bawah Koleksi -->
  <div class="start-btn-container">
    <button class="btn-start-all" onclick="startFlashcard(0)">Mulai Flashcard ▶</button>
  </div>

  <!-- Area Flashcard (Tersembunyi sampai gambar diklik) -->
  <main class="card" id="flashcard-section" style="display:none;">
    <div class="card-top">
      <div class="category" id="category-label">Kategori</div>
      <button class="shuffle" onclick="closeFlashcard()">Tutup / Close</button>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    
    <section class="learning centered" id="learning">
      <div class="visual-container">
        <img id="visual-img" class="visual-img" src="" alt="Flashcard Item">
      </div>
      <div class="answer" id="answer">
        <div class="answer-label">Answer / Jawaban</div>
        <div class="word" id="word"></div>
        <div class="pron" id="pron"></div>
        <div class="meaning" id="meaning"></div>
      </div>
    </section>
    
    <div class="timer" id="timer">Perhatikan gambarnya... 10</div>
    <div class="actions">
      <button class="btn btn-secondary" id="skip" onclick="revealAnswer()">Skip / Lewati</button>
      <button class="btn btn-primary" id="next" onclick="nextCard()" disabled>Berikutnya / Next &rarr;</button>
    </div>
  </main>
</div>

<!-- Load Data per Kategori (File Terpisah) -->
<script src="assets/js/data-badan.js"></script>
<script src="assets/js/data-warna.js"></script>
<script src="assets/js/data-hewan.js"></script>
<script src="assets/js/data-benda.js"></script>
<!-- Load App Logic -->
<script src="assets/js/app.js"></script>
</body>
</html>
